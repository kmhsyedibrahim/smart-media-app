<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Media Network</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B1329">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="preload" href="https://script.google.com/macros/s/AKfycbz9057cZiUHt4l9yc3HUud3EJ4obEICQBnbtVeGgP0WkGo-jYLkJqC7yJKiu3c453wNLA/exec" as="document">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #0B1329; 
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    iframe.ready {
      visibility: visible;
      opacity: 1;
    }

    #splash {
      position: fixed;
      inset: 0;
      background-color: #0B1329;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    #splash img {
      width: 250px;
      height: 250px;
      border-radius: none;
      box-shadow: none;
      opacity: 1;
    }

    #splash.hide {
      opacity: 0;
      transform: scale(1.06);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icon-512.png" alt="Smart Media Network">
  </div>

  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbz9057cZiUHt4l9yc3HUud3EJ4obEICQBnbtVeGgP0WkGo-jYLkJqC7yJKiu3c453wNLA/exec" allow="camera; microphone; geolocation"></iframe>

  <script>
    const frame = document.getElementById('appFrame');
    const splash = document.getElementById('splash');

    frame.addEventListener('load', () => {
      setTimeout(() => {
        frame.classList.add('ready');
        splash.classList.add('hide');
        setTimeout(() => splash.remove(), 450);
      }, 600);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
